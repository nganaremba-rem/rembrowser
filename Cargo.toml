[package]
name = "rembrowser"
version = "0.1.0"
edition = "2024"

[dependencies]
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
cef = { version = "=154.5.0", default-features = false }
flate2 = "1.1.10"
libc = "0.2.190"
serde_json = "1.0.151"
sha2 = "0.11.0"
yaml-rust2 = "0.13.0"

# One slow, careful build: the ad-block matcher (every request, IO thread) gets inlined
# across crates. Dev loop too slow? `cargo build --release --config profile.release.lto=false`.
[profile.release]
lto = "fat"
codegen-units = 1
